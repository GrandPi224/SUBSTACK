name: Bucky's Blokes checklist
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC (8 AM ET)
permissions:
  contents: write
concurrency:
  group: buckys-blokes
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy matplotlib requests
      - run: python checklist/build.py
      - name: Commit refreshed charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checklist
          git diff --cached --quiet || git commit -m "Bucky's Blokes checklist: refresh from FRED"
          git pull --rebase
          git push
